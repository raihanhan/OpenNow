[package]
name = "open-now"
version = "0.1.0"
edition = "2021"
description = "Cross-platform shortcut manager with global hotkeys and system tray"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[dependencies]
# GUI
eframe = { version = "0.29", features = ["persistence", "accesskit"] }
egui = "0.29"
egui_extras = "0.29"

# System tray
tray-icon = "0.17"

# Global hotkeys
global-hotkey = "0.5"

# Windowing
winit = { version = "0.30", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
dirs = "5.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
open = "4.0"
image = { version = "0.25", features = ["png"] }
once_cell = "1.19"
parking_lot = "0.12"
notify = { version = "6.1", features = ["serde"] }
rfd = "0.14"

# Linux GTK initialization for tray
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

# Platform-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
] }
winres = { version = "0.1", optional = true }

[build-dependencies]
winres = { version = "0.1", cfg = "windows" }

[[bin]]
name = "open-now"
path = "src/main.rs"