name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: open-now-windows.exe
            binary: open-now.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: open-now-linux
            binary: open-now
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: open-now-macos
            binary: open-now
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: open-now-macos-arm64
            binary: open-now

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config gtk+3

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p artifacts/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} artifacts/${{ matrix.artifact }}/
          
          # Windows: also copy any DLLs if needed
          if [ "${{ runner.os }}" = "Windows" ]; then
            # No extra DLLs needed for static MSVC build
            :
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}/
          retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            if [ "$name" = "open-now-windows.exe" ]; then
              cp "$dir/open-now.exe" "release/open-now-windows-x64.exe"
            elif [ "$name" = "open-now-linux" ]; then
              cp "$dir/open-now" "release/open-now-linux-x64"
              chmod +x "release/open-now-linux-x64"
            elif [ "$name" = "open-now-macos" ]; then
              cp "$dir/open-now" "release/open-now-macos-x64"
              chmod +x "release/open-now-macos-x64"
            elif [ "$name" = "open-now-macos-arm64" ]; then
              cp "$dir/open-now" "release/open-now-macos-arm64"
              chmod +x "release/open-now-macos-arm64"
            fi
          done

          # Create checksums
          cd release
          sha256sum * > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false